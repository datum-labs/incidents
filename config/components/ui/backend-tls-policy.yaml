apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: incidents-apiserver-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: incidents-apiserver
  validation:
    caCertificateRefs:
      - name: incidents-ca-secret
        group: ""
        kind: Secret
    hostname: incidents-apiserver.incidents-system.svc
