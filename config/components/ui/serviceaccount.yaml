apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidents-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incidents-ui
rules:
  # Full access to incidents resources
  - apiGroups: ["incidents.operations.miloapis.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incidents-ui
subjects:
  - kind: ServiceAccount
    name: incidents-ui
    namespace: incidents-system
roleRef:
  kind: ClusterRole
  name: incidents-ui
  apiGroup: rbac.authorization.k8s.io
