apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incidents-system

resources:
  - ../../base

# Observability and tracing components are intentionally excluded here.
# The demo kind cluster does not run Grafana or Jaeger.
components:
  - ../../components/namespace
  - ../../components/api-registration
  - ../../components/cert-manager-ca
  - ../../components/ui

images:
  - name: ghcr.io/datum-cloud/incidents
    newTag: dev
  - name: ghcr.io/datum-cloud/incidents-ui
    newTag: dev

patches:
  - path: irm-stub-patch.yaml
    target:
      kind: Deployment
      name: incidents-apiserver
  - path: incidents-ui-token-patch.yaml
    target:
      kind: Deployment
      name: incidents-ui
