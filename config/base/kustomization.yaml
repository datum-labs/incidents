apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incidents-system

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - secret.yaml
  - rbac-auth-reader.yaml
  - rbac-cluster.yaml
  - certificate.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: incidents
      app.kubernetes.io/instance: incidents-apiserver
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/part-of: incidents.operations.miloapis.com
      app.kubernetes.io/managed-by: kustomize

# Images (will be replaced by overlays for different environments)
images:
  - name: ghcr.io/datum-cloud/incidents
    newTag: dev

# JSON patches to ensure rbac-auth-reader stays in kube-system
# These are applied AFTER all other transformations
patches:
  - target:
      kind: RoleBinding
      name: incidents-apiserver-auth-reader
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kube-system
      - op: replace
        path: /subjects/0/namespace
        value: incidents-system
